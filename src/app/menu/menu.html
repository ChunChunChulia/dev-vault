<header class="menu">

  <div class="menu-inner">

    <div class="logo">
      DEV<span class="slashes">//</span>VAULT
    </div>

    <nav>
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        HOME
      </a>

      <a
        routerLink="/snippets"
        routerLinkActive="active">
        CODE
      </a>

      <a
        routerLink="/reference"
        routerLinkActive="active">
        REFERENCE
      </a>

      <a
        routerLink="/resources"
        routerLinkActive="active">
        RESOURCES
      </a>
      @if(auth.cargando()){
        <span class="session-status">Comprobando sesión...</span>
      } @else {
        @if(auth.admin()){
          <button type="button" (click)="auth.cerrarSesion()">
            Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" routerLinkActive="active">
            ADMIN
          </a>
        }
      }
    </nav>

  </div>

  @if(auth.mensaje()){
    <p class="session-message">{{ auth.mensaje() }}</p>
  }
</header>
